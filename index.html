<style>

html {
    scroll-behavior: smooth;

section {
    scroll-margin-top: 90px;

.hire-box {
    max-width: 900px;
    margin: auto;
    padding: 45px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
}

.hire-box h3 {
    font-size: 28px;
    margin: 0 0 15px;
}

.hire-box p {
    color: var(--muted);
}

.hire-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 25px 0;
}

.hire-list div {
    padding: 12px 15px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: #c9d5e4;
}

.hire-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 25px;
}

@media(max-width:600px) {
    .hire-box {
        padding: 25px;
    }

    .hire-list {
        grid-template-columns: 1fr;
    }
}
